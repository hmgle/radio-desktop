name: Desktop smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: astral-sh/setup-uv@v7
      - run: bun install --frozen-lockfile
      - name: Install WebView and virtual display
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0 libgtk-3-0t64 libpulse0 xvfb xauth dbus-x11
      - name: Exercise native menus and persistent settings
        run: dbus-run-session -- xvfb-run -a uv run --no-project tools/test-desktop.py
