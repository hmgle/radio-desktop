name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Check Go formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go tool mygo vet .
      - name: Install audio isolation dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpulse0
      - run: RADIO_AUDIO_TEST=1 go test ./internal/...
      - name: Check generated bindings
        run: |
          go tool mygo generate
          git diff --exit-code -- src/mygo.ts
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build:web
